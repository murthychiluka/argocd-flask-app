apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-app
  namespace: flask-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: flask.murthydevops.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-app
            port:
              number: 80