    # .github/workflows/ci-cd.yml
name: CI/CD Pipeline - Flask App on EKS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  AWS_REGION:     us-east-1
  ECR_REPOSITORY: flask-app
  IMAGE_TAG:      ${{ github.sha }}

jobs:

  # ─────────────────────────────────────
  # JOB 1: CI - Test
  # ─────────────────────────────────────
  test:
    name: Run Tests
    # GitHub hosted runner! ✅
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run Tests
        run: |
          cd app
          python -m pytest tests/ \
            -v \
            --junitxml=test-results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/test-results.xml

  # ─────────────────────────────────────
  # JOB 2: Build and Push to ECR
  # ─────────────────────────────────────
  build:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configure AWS using secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building image..."
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          echo "Build complete! ✅"

      # Push to ECR
      - name: Push to ECR
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image-uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            >> $GITHUB_OUTPUT
          echo "Pushed! ✅"
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ─────────────────────────────────────
  # JOB 3: Update K8s Manifest
  # ─────────────────────────────────────
  update-manifest:
    name: Update K8s Manifest
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use PAT for push access!
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Update image tag
      - name: Update Image Tag
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Before update:"
          grep "image:" k8s/deployment.yaml

          # Update image tag in deployment.yaml
          sed -i \
            "s|image: .*flask-app:.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" \
            k8s/deployment.yaml

          echo "After update:"
          grep "image:" k8s/deployment.yaml

      # Commit and push
      - name: Commit Updated Manifest
        run: |
          git config user.email "github-actions@github.com"
          git config user.name  "GitHub Actions Bot"

          git add k8s/deployment.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: update image to $IMAGE_TAG [skip ci]"
            git push origin main
            echo "Manifest updated! ✅"
          fi

  # ─────────────────────────────────────
  # JOB 4: Deploy via ArgoCD
  # ─────────────────────────────────────
  deploy:
    name: Deploy via ArgoCD
    needs: update-manifest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: http://flask.murthydevops.online

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # Install kubectl
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # Configure kubectl for EKS
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

          echo "kubectl configured! ✅"
          kubectl get nodes

      # Install ArgoCD CLI
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/
          argocd version --client

      # Apply ArgoCD Application
      - name: Apply ArgoCD Application
        run: |
          kubectl apply -f argocd/application.yaml
          echo "ArgoCD app applied! ✅"

      # Login to ArgoCD
      - name: Login to ArgoCD
        run: |
          argocd login \
            ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure \
            --grpc-web
          echo "ArgoCD login! ✅"

      # Sync ArgoCD App
      - name: Sync ArgoCD App
        run: |
          argocd app sync flask-app \
            --force \
            --prune \
            --timeout 300
          echo "Sync started! ✅"

      # Wait for healthy
      - name: Wait for Deployment
        run: |
          argocd app wait flask-app \
            --health \
            --timeout 300
          echo "App healthy! ✅"

      # Verify
      - name: Verify Deployment
        run: |
          echo "ArgoCD Status:"
          argocd app get flask-app

          echo "Pods:"
          kubectl get pods \
            -n flask-app \
            -l app=flask-app

          echo "Deployment:"
          kubectl rollout status \
            deployment/flask-app \
            -n flask-app

      # Summary
      - name: Deployment Summary
        if: always()
        run: |
          echo "================================================"
          echo "✅ DEPLOYMENT COMPLETE"
          echo "Image    : ${{ needs.build.outputs.image-uri }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Actor    : ${{ github.actor }}"
          echo "================================================"